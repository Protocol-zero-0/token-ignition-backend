version: "3.9"

# Token-Ignition backend  ·  v0.2
#
# Four services on a single private network:
#   audit-receiver — public HTTP trigger endpoint called by the frontend
#   mcp-tools  — our two audit tools exposed as an MCP server
#   nanobot    — the audit agent runtime (internal only)
#   watchdog   — read-only ledger observer
#
# Everything is driven by ../config.yaml via ./scripts/render_nanobot_config.py

networks:
  ti-net:
    driver: bridge

services:
  audit-receiver:
    build:
      context: ./audit-receiver
    container_name: ti-audit-receiver
    depends_on:
      - nanobot
      - mcp-tools
    ports:
      # Public trigger endpoint used by the Vercel API layer.
      - "${AUDIT_RECEIVER_PORT:-8080}:8080"
    environment:
      - LEDGER_REPO=${LEDGER_REPO}
      - LEDGER_BRANCH=${LEDGER_BRANCH:-main}
      - LEDGER_GITHUB_TOKEN=${LEDGER_GITHUB_TOKEN}
      - NANOBOT_TRIGGER_SECRET=${NANOBOT_TRIGGER_SECRET}
      - NANOBOT_CHAT_URL=${NANOBOT_CHAT_URL:-http://nanobot:8080/v1/chat/completions}
      - NANOBOT_GATE1_MODEL=${NANOBOT_GATE1_MODEL:-ti-gate-1}
      - AUDIT_SWEEP_ON_STARTUP=${AUDIT_SWEEP_ON_STARTUP:-true}
      - AUDIT_SWEEP_INTERVAL_SEC=${AUDIT_SWEEP_INTERVAL_SEC:-300}
      - AUDIT_SWEEP_LIMIT=${AUDIT_SWEEP_LIMIT:-10}
    networks:
      - ti-net
    restart: unless-stopped

  mcp-tools:
    build:
      context: ./mcp-tools
    container_name: ti-mcp-tools
    environment:
      - LEDGER_REPO=${LEDGER_REPO}
      - LEDGER_BRANCH=${LEDGER_BRANCH:-main}
      - LEDGER_GITHUB_TOKEN=${LEDGER_GITHUB_TOKEN}
      - MCP_PORT=9000
    networks:
      - ti-net
    restart: unless-stopped

  nanobot:
    build:
      context: ./nanobot
    container_name: ti-nanobot
    depends_on:
      - mcp-tools
    expose:
      - "8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NANOBOT_TRIGGER_SECRET=${NANOBOT_TRIGGER_SECRET}
    volumes:
      - ./nanobot/nanobot.config.json:/root/.nanobot/config.json:ro
      - ./prompts:/app/prompts:ro
      - nanobot-data:/root/.nanobot/data
    networks:
      - ti-net
    restart: unless-stopped

  watchdog:
    build:
      context: ./watchdog
    container_name: ti-watchdog
    environment:
      - LEDGER_REPO=${LEDGER_REPO}
      - LEDGER_BRANCH=${LEDGER_BRANCH:-main}
      - WATCHDOG_INTERVAL_SEC=${WATCHDOG_INTERVAL_SEC:-300}
      - WD_REJECTED_RATIO_MAX=${WD_REJECTED_RATIO_MAX:-0.85}
      - WD_REJECTED_RATIO_MIN=${WD_REJECTED_RATIO_MIN:-0.05}
      - WD_REJECTED_MIN_SAMPLE=${WD_REJECTED_MIN_SAMPLE:-10}
      - WD_PENDING_STUCK_MINUTES=${WD_PENDING_STUCK_MINUTES:-15}
      - WATCHDOG_WEBHOOK_URL=${WATCHDOG_WEBHOOK_URL:-}
      - WATCHDOG_TELEGRAM_BOT_TOKEN=${WATCHDOG_TELEGRAM_BOT_TOKEN:-}
      - WATCHDOG_TELEGRAM_CHAT_ID=${WATCHDOG_TELEGRAM_CHAT_ID:-}
    volumes:
      - watchdog-data:/var/lib/ti-watchdog
    networks:
      - ti-net
    restart: unless-stopped

volumes:
  nanobot-data:
  watchdog-data:
