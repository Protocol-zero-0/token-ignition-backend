# ============================================================================
# Token-Ignition backend  ·  v0.2
# ----------------------------------------------------------------------------
#  This is the ONLY file you need to edit.
#
#  Usage:
#    cp config.example.yaml config.yaml
#    # fill in the {{...}} placeholders below
#    ./setup.sh
#
#  Any change in this file takes effect after re-running ./setup.sh
# ============================================================================

# ---------------------------------------------------------------------------
# 1. Ledger repository  (public GitHub repo that records all verdicts)
# ---------------------------------------------------------------------------
#  Every submission ends up as a JSON file at:
#    https://github.com/<repo>/blob/<branch>/submissions/<hash>.json
#
#  Leave as {{LEDGER_REPO}} until you decide the final location.
#  Suggested: billion-token-one-task/token-ignition-ledger
#
ledger:
  repo:   "{{LEDGER_REPO}}"           # e.g. billion-token-one-task/token-ignition-ledger
  branch: "main"
  # A GitHub PAT with Contents:read+write on the ledger repo above.
  # Generate at:  https://github.com/settings/personal-access-tokens/new
  github_token: "{{LEDGER_GITHUB_TOKEN}}"

# ---------------------------------------------------------------------------
# 2. The three gates  ·  which model judges which gate
# ---------------------------------------------------------------------------
#  Model strings follow the "provider/model" convention used by nanobot.
#  Gate.3 uses three-family consensus (2-of-3 agreement required).
#
gates:
  gate1:                              # admission       1M token budget
    model: "anthropic/claude-opus-4-7"
    temperature: 0.1

  gate2:                              # verified        10M token budget
    model: "anthropic/claude-opus-4-7"
    temperature: 0.1

  gate3:                              # research        100M token budget + invite
    consensus:
      - "anthropic/claude-opus-4-7"
      - "openai/gpt-5.3-codex"
      - "google/gemini-3.1-pro"
    quorum: 2                         # how many models must agree = pass
    temperature: 0.1

# ---------------------------------------------------------------------------
# 3. LLM provider API keys
# ---------------------------------------------------------------------------
providers:
  anthropic:
    api_key: "{{ANTHROPIC_API_KEY}}"
  openai:
    api_key: "{{OPENAI_API_KEY}}"
  google:
    api_key: "{{GOOGLE_API_KEY}}"

# ---------------------------------------------------------------------------
# 4. Nanobot  ·  the audit agent runtime
# ---------------------------------------------------------------------------
nanobot:
  # Internal listen address (inside docker network)
  host: "0.0.0.0"
  port: 8080

  # The public URL that the Vercel API layer calls to trigger audits.
  # Typical values:
  #   https://ti-audit.your-domain.com        (recommended, with TLS)
  #   http://203.0.113.42:8080                 (dev only, no TLS)
  public_url: "{{NANOBOT_PUBLIC_URL}}"

  # Shared secret the Vercel layer must send as Authorization: Bearer <token>
  # Generate one with:  openssl rand -hex 32
  trigger_secret: "{{NANOBOT_TRIGGER_SECRET}}"

# ---------------------------------------------------------------------------
# 5. Frontend ledger polling
# ---------------------------------------------------------------------------
frontend:
  ledger_poll_seconds: 10
  show_recent: 10

# ---------------------------------------------------------------------------
# 6. Watchdog  (L4 — observability & alerts)
# ---------------------------------------------------------------------------
#  Read-only observer that polls the ledger and alerts when something looks
#  off (unusual rejection rate, stuck pending, auditor self-flagging
#  injection attempts, etc.).
#
#  Every notifier below is OPTIONAL. Leave a field as empty string "" to
#  disable that channel. If all channels are empty, alerts are logged
#  only (docker compose logs -f watchdog).
#
watchdog:
  enabled: true
  interval_seconds: 300     # how often to check; 300s = 5 minutes

  thresholds:
    rejected_ratio_max: 0.85    # >85% rejection over 24h  -> warn
    rejected_ratio_min: 0.05    # <5%  rejection over 24h  -> warn (too permissive?)
    rejected_min_sample: 10     # don't evaluate ratios below this sample size
    pending_stuck_minutes: 15   # pending for longer than this -> error

  notifiers:
    # Generic webhook. Works for Discord, Slack, Feishu, and any endpoint
    # that accepts JSON. Leave as "" to disable.
    webhook_url: ""

    # Telegram bot notifier. Leave both empty to disable.
    # How to set up:
    #   1. In Telegram, talk to @BotFather, create a new bot, copy the token
    #   2. Send your bot any message, then visit:
    #      https://api.telegram.org/bot<TOKEN>/getUpdates
    #      to find your chat id
    telegram:
      bot_token: ""
      chat_id:   ""
